<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL in ONE - Anime Pro</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>

<style>
body{background:#000;color:#fff;font-family:sans-serif}
.anime-text{background:linear-gradient(90deg,#007AFF,#ff00c8,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pro-card{background:#111;padding:10px;border-radius:10px}
</style>
</head>

<body>

<h1 class="anime-text text-center text-3xl mt-5">ALL IN ONE HUB</h1>

<div class="text-center mt-5">
<input id="fTitle" placeholder="Title">
<input id="fLink" placeholder="Link">
<button onclick="uploadData()">UPLOAD</button>
</div>

<div id="main-grid" class="grid grid-cols-2 gap-4 p-4"></div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD_eAXOHIZ5zh_CDHySc9JxBY4FdQ713kQ",
  authDomain: "all-in-one-hub-3ab07.firebaseapp.com",
  projectId: "all-in-one-hub-3ab07",
  storageBucket: "all-in-one-hub-3ab07.firebasestorage.app",
  messagingSenderId: "592397180911",
  appId: "1:592397180911:web:6187a688c2366cad32201a",
  measurementId: "G-HVBFG81BR3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function uploadData(){
let t=document.getElementById('fTitle').value;
let l=document.getElementById('fLink').value;
db.collection("anime_hub").add({t,l,ts:Date.now()})
}

db.collection("anime_hub").orderBy("ts","desc").onSnapshot(snap=>{
let html='';
snap.forEach(doc=>{
let d=doc.data();
html+=`<div class="pro-card">
<h3>${d.t}</h3>
<a href="${d.l}" target="_blank">Open</a>
</div>`;
});
document.getElementById('main-grid').innerHTML=html;
});

</script>

</body>
</html>
