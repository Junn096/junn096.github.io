<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALL in ONE - Anime Pro</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #particles-js { position: fixed; width: 100%; height: 100%; z-index: -1; }

        /* RGB ANIME TEXT ANIMATION */
        .anime-text {
            background: linear-gradient(90deg, #007AFF, #ff00c8, #00ff88, #007AFF);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flow 4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 122, 255, 0.5));
            font-weight: 900;
        }

        @keyframes flow {
            0% { background-position: 0%; }
            100% { background-position: 100%; }
        }

        .glass-ios {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Compact Buttons */
        .cat-btn {
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            transition: 0.4s all cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #666;
        }

        .cat-btn.active {
            background: #007AFF;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.6);
            transform: scale(1.1);
        }

        .pro-card {
            background: #0a0a0c;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .pro-card:hover {
            border-color: #007AFF;
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(0, 122, 255, 0.2);
        }

        .hidden-panel { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body oncontextmenu="return false">

    <div id="particles-js"></div>

    <!-- Nav -->
    <nav class="sticky top-0 z-[100] glass-ios px-6 py-5 flex justify-between items-center border-b border-white/5">
        <h1 class="text-2xl anime-text uppercase tracking-tighter">ALL IN ONE</h1>
        <div class="flex items-center gap-4">
            <button onclick="ownerAuth()" id="loginBtn" class="text-xs font-bold text-gray-500 tracking-widest">OWNER</button>
            <button onclick="logout()" id="logoutBtn" class="hidden-panel text-red-500 text-xs font-bold">LOGOUT</button>
        </div>
    </nav>

    <!-- Admin -->
    <div id="adminArea" class="hidden-panel container mx-auto px-6 mt-6 animate__animated animate__fadeIn">
        <div class="glass-ios p-6 rounded-3xl border-2 border-dashed border-blue-500/30">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
                <input type="text" id="fTitle" placeholder="Title" class="bg-black/50 p-4 rounded-xl outline-none text-sm border border-white/5">
                <input type="text" id="fLink" placeholder="URL" class="bg-black/50 p-4 rounded-xl outline-none text-sm border border-white/5">
                <select id="fCat" class="bg-black p-4 rounded-xl outline-none text-sm text-blue-500">
                    <option value="mod">MOD</option>
                    <option value="pdf">PDF</option>
                    <option value="course">COURSE</option>
                    <option value="dp">WALLPAPER</option>
                    <option value="apk">APK</option>
                </select>
                <input type="file" id="fImg" class="bg-white/5 p-3 rounded-xl text-[10px]">
                <button onclick="uploadData()" id="upBtn" class="bg-blue-600 py-4 rounded-xl font-bold shadow-xl">PUBLISH</button>
            </div>
        </div>
    </div>

    <!-- Filters (iOS Buttons) -->
    <div class="sticky top-[78px] z-[90] glass-ios py-4">
        <div class="flex gap-4 px-6 overflow-x-auto no-scrollbar" id="filter-bar">
            <button onclick="filterItems('all', this)" class="cat-btn active">ALL</button>
            <button onclick="filterItems('mod', this)" class="cat-btn">MODS</button>
            <button onclick="filterItems('pdf', this)" class="cat-btn">PDFs</button>
            <button onclick="filterItems('course', this)" class="cat-btn">COURSES</button>
            <button onclick="filterItems('dp', this)" class="cat-btn">WALLPAPER</button>
        </div>
    </div>

    <!-- Hero -->
    <header class="pt-16 pb-10 text-center px-6">
        <h2 class="text-5xl md:text-7xl anime-text uppercase mb-6" id="hero-title">ALL IN ONE</h2>
        <div class="max-w-md mx-auto glass-ios p-2 flex items-center rounded-2xl">
            <i class="fa fa-search ml-4 text-gray-600"></i>
            <input type="text" id="searchBox" onkeyup="localSearch()" placeholder="Search Resources..." class="w-full bg-transparent p-4 outline-none text-xs">
        </div>
    </header>

    <!-- Main Grid -->
    <main class="container mx-auto px-6 pb-40">
        <div id="main-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Data from Firebase -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 w-full glass-ios p-5 flex justify-between items-center px-10 text-[10px] font-bold text-gray-600 uppercase tracking-widest">
        <button onclick="togglePrivacy()">Privacy Policy</button>
        <p>ALL IN ONE HUB</p>
    </footer>

    <!-- Scripts -->
    <script>
        // 1. FIREBASE CONFIG (Dalo apna)
        const firebaseConfig = {
            apiKey: "YOUR_KEY",
            authDomain: "YOUR_ID.firebaseapp.com",
            projectId: "YOUR_ID",
            storageBucket: "YOUR_ID.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let isAdmin = false;
        let allData = [];

        // 2. Animation (GSAP)
        gsap.from(".anime-text", { opacity: 0, scale: 0.8, duration: 1.5, ease: "elastic.out(1, 0.3)" });
        particlesJS("particles-js", { "particles": { "number": { "value": 50 }, "opacity": { "value": 0.2 }, "color": {"value": "#007AFF"}, "move": { "speed": 1 } } });

        // 3. Logic
        function ownerAuth() {
            let p = prompt("Password:");
            if(btoa(p) === "OTk2NjAw") {
                isAdmin = true;
                document.getElementById('adminArea').classList.toggle('hidden-panel');
                renderUI('all');
            }
        }

        function uploadData() {
            const title = document.getElementById('fTitle').value;
            const link = document.getElementById('fLink').value;
            const cat = document.getElementById('fCat').value;
            const imgFile = document.getElementById('fImg').files[0];
            if(!title || !link) return alert("Fill data!");
            if(imgFile) {
                const reader = new FileReader();
                reader.onload = (e) => saveFinal(title, link, cat, e.target.result);
                reader.readAsDataURL(imgFile);
            } else { saveFinal(title, link, cat, null); }
        }

        function saveFinal(t, l, c, i) {
            db.collection("anime_hub").add({ t, l, c, i, ts: Date.now() }).then(() => location.reload());
        }

        db.collection("anime_hub").orderBy("ts", "desc").onSnapshot((snap) => {
            allData = [];
            snap.forEach(doc => allData.push({ id: doc.id, ...doc.data() }));
            renderUI('all');
        });

        function filterItems(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gsap.to("#main-grid", { opacity: 0, scale: 0.9, duration: 0.2, onComplete: () => {
                renderUI(cat);
                gsap.to("#main-grid", { opacity: 1, scale: 1, duration: 0.4 });
            }});
        }

        function renderUI(filter = 'all') {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            const filtered = filter === 'all' ? allData : allData.filter(d => d.c === filter);
            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="pro-card p-4 relative animate__animated animate__zoomIn">
                        ${isAdmin ? `<button onclick="deleteDoc('${item.id}')" class="absolute -top-2 -right-2 bg-red-600 w-8 h-8 rounded-full text-[10px] z-50 shadow-xl">X</button>` : ''}
                        <div class="h-40 rounded-[22px] overflow-hidden mb-4 bg-white/5 border border-white/5">
                            ${item.i ? `<img src="${item.i}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center opacity-10"><i class="fa fa-layer-group text-4xl"></i></div>`}
                        </div>
                        <h4 class="font-bold text-[12px] mb-4 truncate text-gray-300 uppercase tracking-tight">${item.t}</h4>
                        <a href="${item.l}" target="_blank" class="block w-full py-3 bg-blue-600 hover:bg-white hover:text-blue-600 text-center rounded-xl text-[10px] font-extrabold uppercase transition-all duration-300 shadow-lg shadow-blue-600/20">Download</a>
                    </div>
                `;
            });
        }

        function deleteDoc(id) { if(confirm("Delete?")) db.collection("anime_hub").doc(id).delete(); }

        function localSearch() {
            let term = document.getElementById('searchBox').value.toLowerCase();
            document.querySelectorAll('.pro-card').forEach(card => {
                let text = card.querySelector('h4').innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'block' : 'none';
            });
        }

        function togglePrivacy() { alert("No data tracking. Secure Anime Hub."); }
        function logout() { location.reload(); }
    </script>
</body>
</html>
